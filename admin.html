<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pharmacist review</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F3EE; --ink:#2E3123; --olive:#5E6840; --olive-deep:#3F4730;
    --moss:#9DA57B; --rule:#E2DDD6; --muted:#6F6B60; --rose:#B84A3A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
       font-family:'Barlow',system-ui,sans-serif;font-size:15px;line-height:1.6}
  header{border-bottom:1px solid var(--rule);padding:1.4rem clamp(1rem,4vw,3rem);
         display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}
  h1{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.04em;
     font-size:1.9rem;margin:0}
  .sub{color:var(--muted);font-size:.85rem}
  main{padding:clamp(1rem,4vw,3rem);max-width:60rem;margin:0 auto}
  .gate{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:2rem}
  input[type=password]{flex:1 1 18rem;padding:.7rem .9rem;border:1px solid var(--rule);
       border-radius:4px;background:#fff;font:inherit;color:inherit}
  button{font:inherit;font-weight:600;border:0;border-radius:999px;cursor:pointer;
       padding:.7rem 1.4rem;background:var(--olive);color:#fff}
  button:hover{background:var(--olive-deep)}
  button[disabled]{opacity:.5;cursor:default}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--rule)}
  button.danger{background:transparent;color:var(--rose);border:1px solid rgba(184,74,58,.4)}
  .row{border:1px solid var(--rule);background:#fff;border-radius:4px;
       padding:1.2rem 1.3rem;margin-bottom:1rem}
  .row h2{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.04em;
       font-size:1.3rem;margin:0 0 .2rem}
  dl{display:grid;grid-template-columns:9rem 1fr;gap:.2rem .9rem;margin:.9rem 0}
  dt{color:var(--muted);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
  dd{margin:0}
  .actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem;
       border-top:1px solid var(--rule);padding-top:1rem}
  .charge{font-weight:600}
  .note{color:var(--muted);font-size:.85rem}
  .msg{padding:.9rem 1.1rem;border-radius:4px;margin-bottom:1rem;display:none}
  .msg.err{display:block;background:rgba(184,74,58,.08);border:1px solid rgba(184,74,58,.3);color:var(--rose)}
  .msg.ok{display:block;background:rgba(94,104,64,.08);border:1px solid rgba(94,104,64,.3);color:var(--olive-deep)}
  .empty{color:var(--muted);padding:3rem 0;text-align:center}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--cream:#1B1D17;--ink:#ECE8E0;--rule:#333528;--muted:#9B9489}
    :root:not([data-theme="light"]) .row,
    :root:not([data-theme="light"]) input[type=password]{background:#23251E}
  }
</style>
</head>
<body>
<header>
  <h1>Pharmacist review</h1>
  <span class="sub">Approving a formula charges the customer's saved card. Nothing has been charged yet.</span>
</header>

<main>
  <div class="gate">
    <input type="password" id="token" placeholder="Admin token" autocomplete="current-password">
    <button onclick="load()">Open queue</button>
    <button class="ghost" onclick="forget()">Forget token</button>
  </div>

  <div class="msg" id="msg"></div>
  <div id="list"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const money = (n, c) => n == null ? '—' : (c === 'aud' ? 'A$' : '$') + n;

function say(text, kind) {
  const m = $('msg');
  m.textContent = text;
  m.className = 'msg ' + (kind || 'ok');
  if (!text) m.className = 'msg';
}

function token() {
  const t = $('token').value.trim();
  if (t) { try { sessionStorage.setItem('nl_admin', t); } catch (e) {} }
  return t;
}

function forget() {
  try { sessionStorage.removeItem('nl_admin'); } catch (e) {}
  $('token').value = ''; $('list').innerHTML = ''; say('Token forgotten.', 'ok');
}

try {
  const saved = sessionStorage.getItem('nl_admin');
  if (saved) { $('token').value = saved; }
} catch (e) {}

async function api(path, options) {
  const res = await fetch(path, {
    ...options,
    headers: { 'content-type': 'application/json', 'x-admin-token': token(), ...(options || {}).headers }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
  return data;
}

async function load() {
  say('');
  $('list').innerHTML = '<p class="note">Loading…</p>';
  try {
    const { waiting } = await api('/api/pending');
    if (!waiting.length) {
      $('list').innerHTML = '<p class="empty">Nothing waiting for review.</p>';
      return;
    }
    $('list').innerHTML = waiting.map(card).join('');
  } catch (e) {
    $('list').innerHTML = '';
    say(e.message, 'err');
  }
}

function card(c) {
  const a = c.address || {};
  const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, ch =>
    ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[ch]));
  return `
  <div class="row" id="row-${esc(c.id)}">
    <h2>${esc(c.name || 'Unnamed')}</h2>
    <div class="note">${esc(c.email)} · waiting since ${new Date(c.created * 1000).toLocaleDateString()}</div>
    <dl>
      <dt>Formula</dt><dd>${esc(c.formulaId)} — ${esc(c.formulaName)}</dd>
      <dt>Ingredients</dt><dd>${esc(c.summary) || '<span class="note">not recorded</span>'}</dd>
      <dt>Plan</dt><dd>${esc(c.plan)}</dd>
      <dt>Ships to</dt><dd>${esc(a.line1)}, ${esc(a.city)}, ${esc(a.state)} ${esc(a.postal_code)}</dd>
      <dt>Will charge</dt><dd class="charge">${money(c.willCharge, c.currency)}</dd>
    </dl>
    <div class="actions">
      <button onclick="decide('${esc(c.id)}', false, this)">Approve and charge ${money(c.willCharge, c.currency)}</button>
      <button class="danger" onclick="decide('${esc(c.id)}', true, this)">Reject</button>
    </div>
  </div>`;
}

async function decide(id, reject, btn) {
  const reason = reject ? prompt('Reason for rejecting (optional):') || '' : '';
  if (!reject && !confirm('This charges the customer now. Continue?')) return;

  const row = $('row-' + id);
  row.querySelectorAll('button').forEach(b => b.disabled = true);
  btn.textContent = reject ? 'Rejecting…' : 'Charging…';

  try {
    const out = await api('/api/approve', {
      method: 'POST',
      body: JSON.stringify({ customerId: id, reject, reason })
    });
    row.remove();
    say(reject ? 'Marked as rejected. Nothing was charged.'
               : 'Charged ' + money(out.chargedNow, out.currency) + '. The order is on its way to ShipHero.', 'ok');
  } catch (e) {
    row.querySelectorAll('button').forEach(b => b.disabled = false);
    btn.textContent = reject ? 'Reject' : 'Approve and charge';
    say(e.message, 'err');
  }
}
</script>
</body>
</html>
